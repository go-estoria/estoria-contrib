name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cleanup pass this comment used to defer to is done: #24 cleared every finding and
  # lint has reported zero since. No job here is a required check, because main carries no
  # branch protection at all — so what gates a merge is whoever is reading the PR, not this
  # file. Promoting Lint, Test, and Core Drift to hard gates is a repository setting.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the v2 line so a future golangci-lint v3 can't reject the
          # `version: "2"` config and turn the job red for unrelated reasons.
          version: v2.12

  # Single comprehensive test job. The suite has three kinds of tests:
  #   - testcontainers-based (mongo/postgres/kurrent) — self-provision, need Docker
  #     (preinstalled on ubuntu-latest);
  #   - live-server cache tests (redis/valkey) — need a running server, provided
  #     here as service containers;
  #   - pure unit tests (bigcache/freecache/datadog/otel/strategies) — no deps.
  # Running the full `go test ./...` with Docker + these services covers every
  # package deterministically. CI deliberately omits `-short`, which exists for
  # local runs without the services up. The make itest/atest targets aren't used
  # here either: they select by test name, and the redis/valkey cache tests are
  # named TestCache_*, so `make itest` (-run Integration) matches none of them.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        # The valkey cache tests connect to localhost:6380; map host 6380 to the
        # container's default 6379.
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover -timeout 20m ./...
